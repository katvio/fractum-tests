name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  docker-linux:
    name: Linux (Docker)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Build test image
        run: docker build -t fractum-test -f tests/Dockerfile.test .

      - name: Run tests
        run: docker run --rm fractum-test

  native:
    name: ${{ matrix.os }} (native)
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          # 3.12.11+ is only published for Linux by actions/setup-python;
          # 3.12.10 is the latest build available for macOS/Windows.
          # --ignore-requires-python below installs anyway; the suites
          # themselves do not trip the runtime version guard.
          python-version: "3.12.10"

      - name: Install fractum
        run: pip install -e . --ignore-requires-python

      - name: Run test suite
        working-directory: tests
        run: python run_tests.py
